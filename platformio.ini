[platformio]
default_envs = d1_mini_4mb

; One 4 MB image for every Wemos D1 mini variant. It also runs on the 16 MB D1 mini Pro
; (the extra flash is simply unused).
[env:d1_mini_4mb]
platform = espressif8266@^4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200

board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld

lib_deps =
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit NeoPixel@^1.12.3

build_flags =
    ; lwIP variant that includes NAPT (needed for repeating)
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -D FW_VERSION=\"1.2.1\"
