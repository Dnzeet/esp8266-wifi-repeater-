name: Build firmware

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run

      - name: Collect binary
        run: |
          mkdir -p dist
          cp .pio/build/d1_mini_4mb/firmware.bin dist/wifi-repeater-d1-mini-4mb.bin
          cd dist && sha256sum wifi-repeater-d1-mini-4mb.bin > SHA256SUMS.txt
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-repeater-d1-mini-4mb
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
